<div class="modal">
  <div class="modal-content">
    <h2>Editar servicio</h2>

    <form (ngSubmit)="guardarCambios()">
      <label for="nombre">Nombre:</label>
      <input id="nombre" type="text" name="nombre" [(ngModel)]="servicio().nombre" required>

      <label for="precio">Precio:</label>
      <input id="precio" type="number" name="precio" [(ngModel)]="servicio().precio" min="0" required>

      <label>Descripción:</label>
        <input
        type="text"
        [(ngModel)]="servicio()!.descripcion"
        name="descripcion">

      <div class="botones">
        <button type="button" (click)="cerrar.emit()">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>
